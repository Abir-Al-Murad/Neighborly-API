name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Check Python syntax
        run: |
          python - <<'PY'
          import py_compile, glob, sys
          files = [f for f in glob.glob('**/*.py', recursive=True) if 'env/' not in f and '.venv' not in f]
          errors = False
          for f in files:
              try:
                  py_compile.compile(f, doraise=True)
              except Exception as e:
                  print(f"Syntax error in {f}: {e}")
                  errors = True
          if errors:
              sys.exit(1)
          print('All Python files compile')
          PY
